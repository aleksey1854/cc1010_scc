# ============================================================
# a1010.ru на российском сервере (Cloud.ru, 45.151.31.60).
# /etc/nginx/sites-available/a1010
#
# Сайт отдаёт наш же Node (scripts/dev-server.js, служба a1010-app) —
# Vercel из цепочки убран: запросы через наш IP он пропускал только
# после «Security Checkpoint», и запросы данных получали 403 (14.10).
# База — та же Neon. Vercel остаётся запасным: cc1010-scc.vercel.app.
# ============================================================
# журнал с временем ответа и номером запроса: номер уходит и браузеру
# (X-Request-Id), он попадает в журнал сбоев сайта — по нему находим строку тут
log_format a1010 '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time rid=$request_id "$http_user_agent"';

upstream a1010_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

# чужие имена и голый IP — сразу закрываем
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name a1010.ru www.a1010.ru;
  # проверки Let's Encrypt (продление сертификата)
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://a1010.ru$request_uri; }
}

server {
  # nginx 1.24 (Ubuntu 24.04): http2 — так, директивы «http2 on» ещё нет
  listen 443 ssl http2 default_server;
  server_name a1010.ru;
  ssl_certificate     /etc/letsencrypt/live/a1010.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/a1010.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:a1010:10m;

  # апелляция несёт до 3 МБ картинок (в base64 около 4 МБ)
  client_max_body_size 8m;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/a1010-access.log a1010;

  location / {
    proxy_pass http://a1010_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # IP человека для журнала сбоев — его ставит nginx, браузер подделать не может
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    add_header X-Request-Id $request_id always;
    # браузер ждёт ответа 40 с (gs-shim), даём серверу чуть больше
    proxy_read_timeout 60s;
  }
}
